<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rythmo - Tâches & Cycles</title>

  <!-- Métadonnées PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rythmo">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Canvas Confetti pour la célébration du 'Fait !' -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Web App Manifest dynamique -->
  <script>
    const manifest = {
      name: "Rythmo",
      short_name: "Rythmo",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [
        {
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%236366f1'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50'>🔄</text></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    /* Safe areas iOS pour encoche et barre home */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .touch-press {
      transition: transform 0.12s ease-out, filter 0.12s ease-out;
    }
    .touch-press:active {
      transform: scale(0.96);
      filter: brightness(0.9);
    }
    /* Scrollbar invisible */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="min-h-full flex flex-col justify-between max-w-lg mx-auto bg-slate-950 font-sans pb-10">

  <!-- En-tête -->
  <header class="pt-4 pb-3 px-5 sticky top-0 bg-slate-950/80 backdrop-blur-md z-30 border-b border-slate-800/60">
    <div class="flex items-center justify-between">
      <div>
        <div class="flex items-center space-x-2">
          <span class="text-xl">🔄</span>
          <h1 class="text-2xl font-bold tracking-tight text-white">Rythmo</h1>
        </div>
        <p id="current-date" class="text-xs font-medium text-slate-400 capitalize mt-0.5"></p>
      </div>
      <button onclick="openModal()" class="w-11 h-11 rounded-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 transition-all">
        <i class="ph-bold ph-plus text-xl"></i>
      </button>
    </div>

    <!-- Synthèse statut -->
    <div class="flex items-center space-x-2 mt-4 text-xs font-semibold">
      <div id="stat-urgent" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-500/15 text-rose-400 border border-rose-500/20">
        <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
        <span>0 urgentes</span>
      </div>
      <div id="stat-soon" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/20">
        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
        <span>0 bientôt</span>
      </div>
      <div id="stat-ok" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>0 à jour</span>
      </div>
    </div>
  </header>

  <!-- Liste des tâches -->
  <main class="flex-1 px-4 py-4 space-y-3.5" id="task-list">
    <!-- Rendu dynamique JS -->
  </main>

  <!-- Modal Ajout / Modification -->
  <div id="task-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 space-y-5 shadow-2xl transition-all">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h2 id="modal-title" class="text-lg font-bold text-white">Nouvelle Tâche</h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
          <i class="ph-bold ph-x text-base"></i>
        </button>
      </div>

      <form id="task-form" onsubmit="saveTask(event)" class="space-y-4 text-sm">
        <input type="hidden" id="task-id">

        <!-- Emoji & Titre -->
        <div class="flex gap-3">
          <div class="w-16">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Icône</label>
            <input type="text" id="task-emoji" required maxlength="2" class="w-full text-center text-2xl bg-slate-800 border border-slate-700 rounded-xl py-2 focus:ring-2 focus:ring-indigo-500 outline-none" value="✨">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nom de la tâche</label>
            <input type="text" id="task-title" required placeholder="Ex: Faire les vitres" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <!-- Fréquence en jours -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Fréquence du cycle (en jours)</label>
          <div class="grid grid-cols-4 gap-2 mb-2">
            <button type="button" onclick="setPresetDays(7)" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-slate-300">1 sem</button>
            <button type="button" onclick="setPresetDays(14)" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-slate-300">2 sem</button>
            <button type="button" onclick="setPresetDays(30)" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-slate-300">1 mois</button>
            <button type="button" onclick="setPresetDays(90)" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-slate-300">3 mois</button>
          </div>
          <input type="number" id="task-days" required min="1" max="999" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ex: 14">
        </div>

        <!-- Date de dernière réalisation -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Fait la dernière fois le</label>
          <input type="date" id="task-last-done" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- Boutons d'action -->
        <div class="pt-3 flex gap-2">
          <button type="button" id="btn-delete" onclick="deleteCurrentTask()" class="hidden px-4 py-3 bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800 rounded-xl font-medium transition-all">
            <i class="ph-bold ph-trash text-lg"></i>
          </button>
          <button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold tracking-wide shadow-lg shadow-indigo-600/30 transition-all touch-press">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur-md text-white border border-slate-700/80 px-4 py-2.5 rounded-full text-xs font-medium shadow-xl pointer-events-none transition-all duration-300 opacity-0 transform translate-y-3 flex items-center gap-2 z-50">
    <i class="ph-fill ph-check-circle text-emerald-400 text-base"></i>
    <span id="toast-message">Action enregistrée !</span>
  </div>

  <script>
    // Tâches par défaut pré-configurées avec des dates de départ réalistes
    const DEFAULT_TASKS = [
      { id: "1", emoji: "🛏️", title: "Changer les draps", frequencyDays: 14, lastDone: getRelativeDateStr(-15) },
      { id: "2", emoji: "🧺", title: "Cycle nettoyage machine", frequencyDays: 30, lastDone: getRelativeDateStr(-27) },
      { id: "3", emoji: "🍽️", title: "Cycle nettoyage lave-vaisselle", frequencyDays: 30, lastDone: getRelativeDateStr(-8) },
      { id: "4", emoji: "🧀", title: "Filtre boîte à fromage", frequencyDays: 90, lastDone: getRelativeDateStr(-25) },
      { id: "5", emoji: "🪟", title: "Faire les vitres", frequencyDays: 60, lastDone: getRelativeDateStr(-10) }
    ];

    let tasks = [];

    // Initialisation
    window.onload = function() {
      // Date du jour en français
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('current-date').textContent = now.toLocaleDateString('fr-FR', options);

      loadTasks();
      renderTasks();
    };

    function getRelativeDateStr(daysDiff) {
      const d = new Date();
      d.setDate(d.getDate() + daysDiff);
      return d.toISOString().split('T')[0];
    }

    function loadTasks() {
      const stored = localStorage.getItem('rythmo_tasks');
      if (stored) {
        try {
          tasks = JSON.parse(stored);
        } catch(e) {
          tasks = DEFAULT_TASKS;
        }
      } else {
        tasks = DEFAULT_TASKS;
        saveToStorage();
      }
    }

    function saveToStorage() {
      localStorage.setItem('rythmo_tasks', JSON.stringify(tasks));
    }

    // Calcul de l'état d'urgence d'une tâche
    function computeTaskHealth(task) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const lastDone = new Date(task.lastDone);
      lastDone.setHours(0,0,0,0);

      const diffTime = today.getTime() - lastDone.getTime();
      const elapsedDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
      const remainingDays = task.frequencyDays - elapsedDays;
      const progressPercent = Math.min(100, Math.round((elapsedDays / task.frequencyDays) * 100));

      let status = "ok"; // ok | soon | urgent
      let badgeText = "";
      let colorClass = "from-emerald-500 to-teal-400";
      let bgCardBorder = "border-slate-800/80";

      if (remainingDays < 0) {
        status = "urgent";
        const overdue = Math.abs(remainingDays);
        badgeText = `En retard de ${overdue}j`;
        colorClass = "from-rose-500 to-red-600";
        bgCardBorder = "border-rose-500/40";
      } else if (remainingDays === 0) {
        status = "urgent";
        badgeText = "À faire aujourd'hui";
        colorClass = "from-rose-500 to-red-600";
        bgCardBorder = "border-rose-500/30";
      } else if (remainingDays <= Math.ceil(task.frequencyDays * 0.2) || remainingDays <= 3) {
        status = "soon";
        badgeText = `Reste ${remainingDays}j`;
        colorClass = "from-amber-400 to-orange-500";
        bgCardBorder = "border-amber-500/30";
      } else {
        status = "ok";
        badgeText = `Reste ${remainingDays}j`;
        colorClass = "from-emerald-400 to-teal-500";
      }

      return {
        elapsedDays,
        remainingDays,
        progressPercent,
        status,
        badgeText,
        colorClass,
        bgCardBorder
      };
    }

    // Affichage des cartes triées par urgence (retard en haut)
    function renderTasks() {
      const listContainer = document.getElementById('task-list');
      listContainer.innerHTML = '';

      // Calcul des métriques pour chaque tâche
      const enrichedTasks = tasks.map(t => ({
        ...t,
        health: computeTaskHealth(t)
      }));

      // Tri : les plus urgents (remainingDays le plus faible / négatif) en premier
      enrichedTasks.sort((a, b) => a.health.remainingDays - b.health.remainingDays);

      let countUrgent = 0, countSoon = 0, countOk = 0;

      enrichedTasks.forEach(task => {
        if (task.health.status === 'urgent') countUrgent++;
        else if (task.health.status === 'soon') countSoon++;
        else countOk++;

        const formattedDate = new Date(task.lastDone).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

        const card = document.createElement('div');
        card.className = `relative overflow-hidden rounded-2xl bg-slate-900/90 border ${task.health.bgCardBorder} p-4 transition-all duration-200 shadow-md flex flex-col justify-between`;
        card.id = `task-card-${task.id}`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 cursor-pointer" onclick="openModal('${task.id}')">
            <div class="flex items-center gap-3">
              <span class="text-3xl p-2 rounded-2xl bg-slate-800/80 ring-1 ring-slate-700/50">${task.emoji}</span>
              <div>
                <h3 class="font-bold text-white text-base leading-tight">${task.title}</h3>
                <p class="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
                  <span>Dernier fait : <strong>${formattedDate}</strong></span>
                  <span>•</span>
                  <span>Cycle : ${task.frequencyDays}j</span>
                </p>
              </div>
            </div>

            <!-- Bouton Fait ! -->
            <button onclick="markAsDone('${task.id}', event)" class="touch-press px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-emerald-600 active:text-white border border-slate-700/80 flex items-center gap-1.5 shadow-sm text-xs font-bold text-emerald-400 transition-colors">
              <i class="ph-bold ph-check text-sm"></i>
              <span>Fait !</span>
            </button>
          </div>

          <!-- Ligne de progression et étiquette -->
          <div class="mt-4">
            <div class="flex justify-between items-center text-xs mb-1.5">
              <span class="font-semibold px-2 py-0.5 rounded-md ${
                task.health.status === 'urgent' ? 'bg-rose-500/20 text-rose-300' :
                task.health.status === 'soon' ? 'bg-amber-500/20 text-amber-300' :
                'bg-emerald-500/20 text-emerald-300'
              }">
                ${task.health.badgeText}
              </span>
              <span class="text-slate-400 font-mono text-[11px]">${task.health.progressPercent}% du cycle</span>
            </div>

            <!-- Barre de progression -->
            <div class="w-full h-2.5 bg-slate-800/90 rounded-full overflow-hidden p-0.5 ring-1 ring-slate-700/40">
              <div class="h-full rounded-full bg-gradient-to-r ${task.health.colorClass} transition-all duration-500 ease-out" style="width: ${task.health.progressPercent}%"></div>
            </div>
          </div>
        `;

        listContainer.appendChild(card);
      });

      // Mise à jour des badges récapitulatifs
      document.getElementById('stat-urgent').innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500 ${countUrgent > 0 ? 'animate-pulse' : ''}"></span><span>${countUrgent} urgentes</span>`;
      document.getElementById('stat-soon').innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>${countSoon} bientôt</span>`;
      document.getElementById('stat-ok').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>${countOk} à jour</span>`;
    }

    // Action 1-clic : Fait !
    function markAsDone(taskId, e) {
      if (e) e.stopPropagation();

      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const todayStr = new Date().toISOString().split('T')[0];
      task.lastDone = todayStr;
      saveToStorage();

      // Confetti & Vibration haptique (si supportée sur l'appareil)
      if (navigator.vibrate) {
        navigator.vibrate([25, 40, 25]);
      }
      confetti({
        particleCount: 40,
        spread: 60,
        origin: { y: 0.8 },
        colors: ['#10b981', '#34d399', '#6ee7b7']
      });

      showToast(`« ${task.title} » validée pour aujourd'hui !`);
      renderTasks();
    }

    // Modale : Ouverture
    function openModal(taskId = null) {
      const modal = document.getElementById('task-modal');
      const form = document.getElementById('task-form');
      const titleEl = document.getElementById('modal-title');
      const btnDelete = document.getElementById('btn-delete');

      form.reset();

      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        titleEl.textContent = "Modifier la tâche";
        document.getElementById('task-id').value = task.id;
        document.getElementById('task-emoji').value = task.emoji;
        document.getElementById('task-title').value = task.title;
        document.getElementById('task-days').value = task.frequencyDays;
        document.getElementById('task-last-done').value = task.lastDone;
        btnDelete.classList.remove('hidden');
      } else {
        titleEl.textContent = "Nouvelle tâche";
        document.getElementById('task-id').value = '';
        document.getElementById('task-emoji').value = '✨';
        document.getElementById('task-days').value = 14;
        document.getElementById('task-last-done').value = new Date().toISOString().split('T')[0];
        btnDelete.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function setPresetDays(days) {
      document.getElementById('task-days').value = days;
    }

    // Modale : Sauvegarde
    function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const emoji = document.getElementById('task-emoji').value.trim() || '📌';
      const title = document.getElementById('task-title').value.trim();
      const frequencyDays = parseInt(document.getElementById('task-days').value, 10);
      const lastDone = document.getElementById('task-last-done').value;

      if (!title || !frequencyDays || !lastDone) return;

      if (id) {
        const index = tasks.findIndex(t => t.id === id);
        if (index !== -1) {
          tasks[index] = { id, emoji, title, frequencyDays, lastDone };
          showToast("Tâche modifiée");
        }
      } else {
        const newTask = {
          id: Date.now().toString(),
          emoji,
          title,
          frequencyDays,
          lastDone
        };
        tasks.push(newTask);
        showToast("Nouvelle tâche ajoutée");
      }

      saveToStorage();
      closeModal();
      renderTasks();
    }

    // Suppression d'une tâche
    function deleteCurrentTask() {
      const id = document.getElementById('task-id').value;
      if (!id) return;

      tasks = tasks.filter(t => t.id !== id);
      saveToStorage();
      closeModal();
      renderTasks();
      showToast("Tâche supprimée");
    }

    // Message Toast éphémère
    function showToast(text) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = text;
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2500);
    }
  </script>
</body>
</html>
